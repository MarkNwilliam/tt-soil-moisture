# Tiny Tapeout project information
project:
  title:        "Soil-Moisture Irrigation ASIC"
  author:       "Mark Nkugwa"
  discord:      "nkugwamarkwilliam"
  description:  "Low-power soil-moisture irrigation controller: rolling-median sensing, irrigation windows, min/max valve on-time and fault protection."
  language:     "SystemVerilog"
  clock_hz:     10000000  # demo clock; RTC runs on a 32768 Hz tick base (TICKS_PER_SEC)
  tiles: "1x1"
  top_module:  "tt_um_soil_moisture"
  source_files:
    - "tt_um_soil_moisture.v"
    - "top.sv"
    - "irr_fsm.sv"
    - "moisture_filter.sv"
    - "regs.sv"
    - "relay_ctrl.sv"
    - "rtc_timer.sv"

pinout:
  # Inputs
  ui[0]: "moisture[0]"
  ui[1]: "moisture[1]"
  ui[2]: "moisture[2]"
  ui[3]: "moisture[3]"
  ui[4]: "moisture[4]"
  ui[5]: "moisture[5]"
  ui[6]: "moisture[6]"
  ui[7]: "moisture[7]"

  # Outputs
  uo[0]: "VALVE"
  uo[1]: "LED0"
  uo[2]: "LED1"
  uo[3]: "FAULT"
  uo[4]: "BAT_CRIT"
  uo[5]: "SENS_VALID"
  uo[6]: ""
  uo[7]: "SW_EN"

  # Bidirectional pins
  uio[0]: "reserved"
  uio[1]: "CS_N"
  uio[2]: "MOSI"
  uio[3]: "SW_EN"
  uio[4]: "SENS_VALID"
  uio[5]: "BAT_CRIT"
  uio[6]: ""
  uio[7]: ""

yaml_version: 6